version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: fqt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-factor}
      MYSQL_USER: ${MYSQL_USER:-factor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-factor}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fqt-network

  redis:
    image: redis:7-alpine
    container_name: fqt-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fqt-network

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fqt-django
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - staticfiles:/app/staticfiles
      - logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fqt-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: fqt-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fqt-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery-beat
    container_name: fqt-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fqt-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fqt-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - staticfiles:/app/staticfiles:ro
    depends_on:
      - django
    networks:
      - fqt-network

volumes:
  mysql_data:
  redis_data:
  staticfiles:
  logs:

networks:
  fqt-network:
    driver: bridge
